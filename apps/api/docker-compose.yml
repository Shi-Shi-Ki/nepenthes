version: '3'
services:
  mysql:
    image: mysql:9.6
    container_name: db
    volumes:
      - db-store:/var/lib/mysql
      - ./logs:/var/log/mysql
      - ./config/my.cnf:/etc/mysql/conf.d/my.cnf
    environment:
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_USER_PASS}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASS}
      - TZ=${TIMEZONE}
    ports:
      - ${DB_PORT}:3306
    env_file:
      - .env
    networks:
      - app-network

  dynamodb:
    image: amazon/dynamodb-local:3.3.0
    container_name: dynamodb
    command: '-jar DynamoDBLocal.jar -sharedDb -inMemory'
    ports:
      - '${DYNAMODB_PORT}:8000'
    env_file:
      - .env
    networks:
      - app-network

  dynamodb-init:
    image: amazon/aws-cli:2.34.9
    depends_on:
      - dynamodb
    networks:
      - app-network
    environment:
      - AWS_ACCESS_KEY_ID=dummy
      - AWS_SECRET_ACCESS_KEY=dummy
      - AWS_REGION=ap-northeast-1
    env_file:
      - .env
    entrypoint: |
      /bin/sh -c "
        echo 'Waiting for DynamoDB to start...'
        sleep 5 
        
        echo 'Creating ${DYNAMODB_TABLE_RESERVATION} table...'
        aws dynamodb create-table --endpoint-url http://${DYNAMODB_INNER_HOST}:${DYNAMODB_INNER_PORT} --table-name ${DYNAMODB_TABLE_RESERVATION} --attribute-definitions AttributeName=event_id,AttributeType=S --key-schema AttributeName=event_id,KeyType=HASH --billing-mode PAY_PER_REQUEST --region ap-northeast-1
          
        echo 'DynamoDB initialization completed!'
      "

  memcached:
    image: memcached:1.6
    container_name: mem
    ports:
      - '${MEMCACHED_PORT}:11211'
    env_file:
      - .env
    networks:
      - app-network

volumes:
  db-store:

networks:
  app-network:
    driver: bridge
